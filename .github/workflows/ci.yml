name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python and XML syntax check
        run: |
          python -m compileall -q payment_arionpay
          python -c "import pathlib, xml.etree.ElementTree as E; [E.parse(p) for p in pathlib.Path('payment_arionpay').rglob('*.xml')]"
